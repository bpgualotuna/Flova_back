sonar.projectKey=flova-backend
sonar.projectName=Flova Backend
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/.tsupgrader/**
sonar.coverage.exclusions=tests/**,src/index.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
